# Compose wrapper for the keep-mcp MCP server (stdio transport).
#
# The MCP client spawns a fresh container per session and talks to it over
# stdin/stdout, so this service publishes no ports and never runs as a daemon.
# The Google master token is provided as a Compose secret: the file on the
# host (see TOKEN_FILE_HOST) is mounted read-only at /run/secrets/ inside the
# container, which matches the server's default GOOGLE_MASTER_TOKEN_FILE.
#
# Configuration lives in a .env file next to this file (see .example.env):
#   GOOGLE_EMAIL     - your Google account email
#   TOKEN_FILE_HOST  - absolute path to the file holding your master token,
#                      e.g. /home/you/.config/keep-mcp/google_master_token (chmod 600)

services:
  keep-mcp:
    build: .
    image: keep-mcp:latest
    # stdio transport: keep stdin open so the MCP client can talk to the server
    stdin_open: true
    environment:
      GOOGLE_EMAIL: ${GOOGLE_EMAIL:?Set GOOGLE_EMAIL in your .env file (see .example.env)}
      # Set to "true" to allow modifying notes without the keep-mcp label
      UNSAFE_MODE: ${UNSAFE_MODE:-false}
    secrets:
      - source: google_master_token
        target: google_master_token

secrets:
  google_master_token:
    file: ${TOKEN_FILE_HOST:?Set TOKEN_FILE_HOST in your .env file (see .example.env)}
